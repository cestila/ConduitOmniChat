name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            sdk/go.sum
            core/go.sum
      - name: gofmt (excluding generated *.pb.go)
        run: |
          out="$(find sdk core -name '*.go' ! -name '*.pb.go' -print0 | xargs -0 gofmt -l)"
          test -z "$out" || { echo "$out"; exit 1; }
      - name: vet
        run: |
          (cd sdk && go vet ./...)
          (cd core && go vet ./...)
      - name: test sdk
        run: cd sdk && go test ./...
      - name: test core
        # Plugin lifecycle tests need plugin binaries, which live in their own repos.
        run: cd core && go test ./...

  proto-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod
      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: install protoc plugins (pinned)
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make proto
      - name: fail on drift
        run: git diff --exit-code

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      # gui tests expect a conduitd binary in bin/
      - run: make daemon
      - run: npm ci
        working-directory: gui
      - run: npm test
        working-directory: gui
