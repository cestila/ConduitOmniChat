name: Update Registry

on:
  release:
    types: [published]
  repository_dispatch:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-registry
  cancel-in-progress: false

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update registry.json from latest GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import copy
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          REGISTRY_PATH = "registry.json"
          METADATA_ASSET_NAMES = {
              "plugin-metadata.json",
              "registry-metadata.json",
              "metadata.json",
          }

          def api_request(url, token, accept="application/vnd.github+json"):
              headers = {
                  "Accept": accept,
                  "User-Agent": "conduit-registry-updater",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          def api_get_json(url, token, accept="application/vnd.github+json"):
              body = api_request(url, token, accept=accept)
              if body is None:
                  return None
              return json.loads(body)

          def fetch_latest_app_release(repo, token):
              rel = api_get_json(f"https://api.github.com/repos/{repo}/releases/latest", token)
              if isinstance(rel, dict) and str(rel.get("tag_name", "")).startswith("v"):
                  return rel
              releases = api_get_json(
                  f"https://api.github.com/repos/{repo}/releases?per_page=20",
                  token,
              )
              if not isinstance(releases, list):
                  return None
              for item in releases:
                  if item.get("draft") or item.get("prerelease"):
                      continue
                  if str(item.get("tag_name", "")).startswith("v"):
                      return item
              return None

          def fetch_release_metadata_asset(release, token):
              if not isinstance(release, dict):
                  return {}
              for asset in release.get("assets") or []:
                  name = str(asset.get("name", "")).lower()
                  if name not in METADATA_ASSET_NAMES:
                      continue
                  asset_url = asset.get("url") or asset.get("browser_download_url")
                  if not asset_url:
                      continue
                  accept = (
                      "application/octet-stream"
                      if asset.get("url")
                      else "application/json"
                  )
                  try:
                      raw = api_request(asset_url, token, accept=accept)
                      if raw:
                          parsed = json.loads(raw)
                          if isinstance(parsed, dict):
                              return parsed
                  except Exception as exc:
                      print(
                          f"warning: failed to load metadata asset {name}: {exc}",
                          file=sys.stderr,
                      )
              return {}

          def load_client_payload(event_name, event_path):
              if event_name != "repository_dispatch" or not event_path or not os.path.exists(event_path):
                  return {}
              with open(event_path, "r", encoding="utf-8") as fh:
                  event = json.load(fh)
              payload = event.get("client_payload")
              return payload if isinstance(payload, dict) else {}

          def payload_matches_plugin(payload, plugin):
              if not payload:
                  return False
              pid = payload.get("plugin_id") or payload.get("id")
              prepo = payload.get("repository")
              return (pid and pid == plugin.get("id")) or (
                  prepo and prepo == plugin.get("repository")
              )

          def pick_field(key, dispatch_meta, asset_meta, existing, default=None):
              if key in dispatch_meta and dispatch_meta[key] is not None:
                  return dispatch_meta[key]
              if key in asset_meta and asset_meta[key] is not None:
                  return asset_meta[key]
              if key in existing and existing[key] is not None:
                  return existing[key]
              return default

          def comparable(doc):
              return {k: v for k, v in doc.items() if k != "updated_at"}

          def main():
              token = os.environ.get("GITHUB_TOKEN", "")
              app_repo = os.environ.get("GITHUB_REPOSITORY") or "cestila/ConduitOmniChat"
              client_payload = load_client_payload(
                  os.environ.get("GITHUB_EVENT_NAME", ""),
                  os.environ.get("GITHUB_EVENT_PATH", ""),
              )

              with open(REGISTRY_PATH, "r", encoding="utf-8") as fh:
                  original = json.load(fh)

              updated = copy.deepcopy(original)

              app_rel = fetch_latest_app_release(app_repo, token)
              if app_rel and app_rel.get("tag_name"):
                  tag = str(app_rel["tag_name"])
                  component = {
                      "version": tag.removeprefix("v"),
                      "tag": tag,
                      "release_url": app_rel.get("html_url", ""),
                  }
                  updated["core"] = dict(component)
                  updated["gui"] = dict(component)
              else:
                  print(f"warning: no app release found for {app_repo}", file=sys.stderr)

              for plugin in updated.get("plugins", []):
                  repo = plugin.get("repository", "")
                  rel = (
                      api_get_json(
                          f"https://api.github.com/repos/{repo}/releases/latest",
                          token,
                      )
                      if repo
                      else None
                  )
                  asset_meta = fetch_release_metadata_asset(rel, token)
                  dispatch_meta = (
                      client_payload
                      if payload_matches_plugin(client_payload, plugin)
                      else {}
                  )

                  if rel and rel.get("tag_name"):
                      tag = str(rel["tag_name"])
                      plugin["latest_version"] = tag.removeprefix("v")
                      if rel.get("html_url"):
                          plugin["release_url"] = rel["html_url"]
                  elif dispatch_meta:
                      tag = str(
                          dispatch_meta.get("tag_name")
                          or dispatch_meta.get("latest_version")
                          or dispatch_meta.get("version")
                          or ""
                      ).strip()
                      if tag:
                          plugin["latest_version"] = tag.removeprefix("v")
                      if dispatch_meta.get("release_url"):
                          plugin["release_url"] = str(dispatch_meta["release_url"])
                  else:
                      print(f"warning: no release found for {repo}", file=sys.stderr)

                  min_proto = pick_field("min_protocol_version", dispatch_meta, asset_meta, plugin, 1)
                  max_proto = pick_field("max_protocol_version", dispatch_meta, asset_meta, plugin, 1)
                  min_core = pick_field("min_core_version", dispatch_meta, asset_meta, plugin)
                  deps = pick_field("dependencies", dispatch_meta, asset_meta, plugin, [])

                  plugin["min_protocol_version"] = int(min_proto)
                  plugin["max_protocol_version"] = int(max_proto)
                  if min_core is not None:
                      plugin["min_core_version"] = str(min_core)
                  if isinstance(deps, list):
                      plugin["dependencies"] = deps

              if comparable(updated) == comparable(original):
                  print("registry.json is already up to date")
                  return

              updated["updated_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              with open(REGISTRY_PATH, "w", encoding="utf-8") as fh:
                  json.dump(updated, fh, indent=2, ensure_ascii=False)
                  fh.write("\n")
              print("Updated registry.json")

          if __name__ == "__main__":
              main()
          PY

      - name: Commit and push registry.json if changed
        run: |
          if git diff --quiet registry.json; then
            echo "No changes to registry.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore(registry): update latest release versions"
          git push origin main
