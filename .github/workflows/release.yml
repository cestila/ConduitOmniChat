name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder: --linux
          - os: windows-latest
            builder: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: build conduitd (linux)
        if: runner.os == 'Linux'
        run: make daemon
      - name: build conduitd (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          cd core && go build -o ../bin/conduitd.exe ./cmd/conduitd
      - run: npm ci
        working-directory: gui
      - name: version the app from the release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: gui
      - name: package
        run: npx electron-builder ${{ matrix.builder }} --publish never
        working-directory: gui
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gui/dist/*.AppImage
            gui/dist/*.tar.gz
            gui/dist/*.exe
