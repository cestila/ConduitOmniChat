name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder: --linux
          - os: windows-latest
            builder: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: build conduitd (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo none)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make daemon VERSION="$VERSION" COMMIT="$COMMIT" BUILD_DATE="$BUILD_DATE"
      - name: build conduitd (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo none)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X github.com/cestila/ConduitOmniChat/core/pkg/buildinfo.Version=${VERSION} -X github.com/cestila/ConduitOmniChat/core/pkg/buildinfo.Commit=${COMMIT} -X github.com/cestila/ConduitOmniChat/core/pkg/buildinfo.Date=${BUILD_DATE}"
          mkdir -p bin
          cd core && go build -ldflags "$LDFLAGS" -o ../bin/conduitd.exe ./cmd/conduitd
      - run: npm ci
        working-directory: gui
      - name: version the app from the release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: gui
      - name: package
        run: npx electron-builder ${{ matrix.builder }} --publish never
        working-directory: gui
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gui/dist/*.AppImage
            gui/dist/*.tar.gz
            gui/dist/*.exe
            gui/dist/latest*.yml

  # Mantiene binaries.nix al día: recalcula el hash de los artefactos recién
  # publicados y abre el PR de bump, así ningún release necesita trabajo manual.
  # El SRI se calcula con openssl (sha256 + base64), el mismo valor que
  # `nix-prefetch-url --type sha256 | nix hash convert --to sri`, sin instalar Nix.
  nix-hashes:
    needs: [goreleaser, electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: rewrite binaries.nix from the published assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          sri() {
            curl -fsSL --retry 3 --retry-delay 2 -o "$2" "$1"
            echo "sha256-$(openssl dgst -sha256 -binary "$2" | openssl base64 -A)"
          }

          APP_IMAGE=$(sri "${BASE}/Conduit-${VERSION}.AppImage" /tmp/appimage)
          CONDUITD=$(sri "${BASE}/conduitd_${VERSION}_linux_amd64.tar.gz" /tmp/conduitd.tgz)

          python3 - "$VERSION" "$APP_IMAGE" "$CONDUITD" <<'PY'
          import re
          import sys

          version, app_image, conduitd = sys.argv[1:4]
          path = "binaries.nix"
          with open(path, encoding="utf-8") as handle:
              content = handle.read()

          replacements = {
              "version": version,
              "appImageHash": app_image,
              "conduitdHash": conduitd,
          }
          for key, value in replacements.items():
              pattern = rf'{key} = "[^"]*";'
              content, count = re.subn(pattern, f'{key} = "{value}";', content, count=1)
              if count != 1:
                  sys.exit(f"binaries.nix: no se pudo reemplazar {key}")

          with open(path, "w", encoding="utf-8") as handle:
              handle.write(content)
          PY

          git diff --stat
      - name: open the bump pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/nix-${{ github.ref_name }}
          base: main
          delete-branch: true
          title: "chore(nix): update precompiled release binaries to ${{ github.ref_name }}"
          commit-message: "chore(nix): update precompiled release binaries to ${{ github.ref_name }}"
          body: |
            Actualiza `binaries.nix` a `${{ github.ref_name }}` con los hashes de los
            artefactos publicados por este release. Lo generó el job `nix-hashes` de
            `.github/workflows/release.yml`; no editar a mano.

            Sin cambios de código: sólo versión y hashes SRI del AppImage y del
            tarball de `conduitd`.
